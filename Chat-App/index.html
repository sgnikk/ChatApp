<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-database-compat.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./index.css">
    <title>Chat App</title>
</head>

<body>
    <div class="container-fluid vh-100 d-flex flex-column p-0">
        <div class="chat-header text-center">Chat Site</div>

        <div id="messages" class="chat-messages flex-grow-1 overflow-auto px-3 py-2"></div>

        <div class="chat-input d-flex flex-column flex-sm-row gap-2 p-3">
            <input type="text" id="username" class="form-control" placeholder="Name" />
            <input type="text" id="messageInput" class="form-control" placeholder="Type a message..." />
            <button onclick="sendMessage()" class="btn send-btn">Send</button>
        </div>
    </div>

    <script src="./index.js"></script>
</body>

</html>
