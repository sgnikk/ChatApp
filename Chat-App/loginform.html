<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100vh;
            overflow: hidden;
            /* Prevent scrolling */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fff;
            color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }


        main {
            background-color: #fff;
            border: 1px solid #000;
            border-radius: 10px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 350px;
            text-align: center;
            box-shadow: 4px 4px 0 #000;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 1.5rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.75rem;
            margin: 0.75rem 0;
            border: 1px solid #000;
            border-radius: 6px;
            font-size: 1rem;
            background-color: #fff;
            color: #000;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #000;
        }

        a.button {
            display: inline-block;
            /* Add this line */
            width: 100%;
            padding: 0.75rem;
            background-color: #000;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            text-align: center;
            /* Center the text */
            transition: all 0.3s;
            margin-top: 1rem;
            text-decoration: none;
        }

        a.button:hover {
            background-color: #fff;
            color: #000;
            border: 1px solid #000;
        }


        .footer-text {
            margin-top: 1.5rem;
            font-size: 0.9rem;
        }

        .footer-text a {
            color: #000;
            text-decoration: underline;
            transition: color 0.3s;
        }

        .footer-text a:hover {
            text-decoration: none;
            color: #E9A319;
            font-weight: bolder;
        }

        a {
            text-decoration: none;
            color: #fff;
        }
    </style>
</head>

<body>
    <main>
        <h1>Log In</h1>
        <form>
            <input type="text" id="username" placeholder="Username" />
            <input type="text" id="password" placeholder="Password" />
            <a href="./index.html" class="button">Log In</a>
        </form>
        <div class="footer-text">
            Don’t have an account yet? <a href="./form.html">Sign up</a>
        </div>
    </main>
</body>

</html>
